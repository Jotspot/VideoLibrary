<table class="manual-table">
  <tbody>
    <tr><td>Play or pause</td><td><kbd>Space</kbd> <kbd>K</kbd></td></tr>
    <tr><td>Back or forward 5 seconds</td><td><kbd>←</kbd> <kbd>→</kbd></td></tr>
    <tr><td>Back or forward 10 seconds</td><td><kbd>J</kbd> <kbd>L</kbd></td></tr>
    <tr><td>Previous or next frame</td><td><kbd>,</kbd> <kbd>.</kbd></td></tr>
    <tr><td>Volume up or down</td><td><kbd>↑</kbd> <kbd>↓</kbd></td></tr>
    <tr><td>Mute</td><td><kbd>M</kbd></td></tr>
    <tr><td>Captions on or off</td><td><kbd>C</kbd></td></tr>
    <tr><td>Full screen</td><td><kbd>F</kbd> or double-click</td></tr>
    <tr><td>Picture in Picture</td><td><kbd>I</kbd></td></tr>
    <tr><td>Leave full screen, then the player</td><td><kbd>Esc</kbd></td></tr>
    <tr><td>Play or pause music (song list selected)</td><td><kbd>Space</kbd></td></tr>
    <tr><td>Settings</td><td><kbd>⌘</kbd> <kbd>,</kbd></td></tr>
  </tbody>
</table>
